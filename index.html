<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker Kuliah</title>
  <link rel="stylesheet" href="style.css">
  <script src="mock-api.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
  <h1>📋 Task Tracker Kuliah <small>v2 · REST API</small></h1>

  <form id="form-tugas" novalidate>
    <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)">
    <div class="row">
      <select id="matkul"></select>
      <input type="date" id="deadline">
      <button type="submit" id="btn-tambah">Tambah</button>
    </div>
    <p id="error" class="error"></p>
  </form>

  <div class="toolbar">
    <div id="filters">
      <button type="button" class="on" data-filter="semua">Semua</button>
      <button type="button" data-filter="aktif">Aktif</button>
      <button type="button" data-filter="selesai">Selesai</button>
    </div>
    <span id="counter"></span>
  </div>

  <div id="status" hidden>
    <span id="status-teks"></span>
    <button type="button" id="btn-retry" hidden>↻ Coba lagi</button>
  </div>

  <ul id="daftar"></ul>
  <p id="kosong" hidden>Belum ada tugas.</p>
</main>
</body>
</html>
